name: Duke Advance iOS 7 (armv7) build
# Linux runner + Theos + iPhoneOS 9.3 SDK, same toolchain as the WL4 legacy build.
# Needs YOUR OWN ROM via secret DUKE_ROM_ID (Google Drive file id). Keep the repo private (generated/ is ROM-derived).
# ONE FILE: drop it into .github/workflows/ of the DukeAdvance-OnlineRecomp repo (the one with patches/, recomp.toml, tools/).
# The whole iOS project is embedded at the bottom (base64 tar.gz) and unpacked into duke-ios7/ by the first step.
on: { workflow_dispatch: {} }
env:
  ROM_SHA1: f01522ee46f5aa821adbba0a97b1a745ff9059f5
  GBARECOMP_REF: 62b6a94
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Unpack embedded iOS project (duke-ios7/)
        run: |
          sed -n '/^# ---- PAYLOAD/,$p' .github/workflows/duke-ios7-build.yml | sed '1d;s/^# //' | base64 -d | tar -xz
          chmod +x duke-ios7/*.sh
          ls duke-ios7
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build python3 python3-pip git curl xz-utils bzip2 zip fakeroot
      - name: ROM
        env: { ROM_ID: "${{ secrets.DUKE_ROM_ID }}" }
        run: |
          pip install --quiet gdown && gdown "$ROM_ID" -O rom.gba
          echo "$ROM_SHA1  rom.gba" | sha1sum -c -
          cp rom.gba "../Duke Nukem Advanced # GBA.GBA"     # tools/scan_seeds.py reads it from the repo parent folder
      - name: gbarecomp + patches 0001-0006 (netplay patches 0007/0008 skipped)
        run: |
          # The Duke patches are CRLF and carry slightly different context than the pinned commit: strip CRs, allow fuzz.
          mkdir -p /tmp/pp; for f in patches/*.patch; do tr -d '\r' < "$f" > "/tmp/pp/$(basename "$f")"; done
          apply_all() {   # $1 = gbarecomp ref
            rm -rf "$GITHUB_WORKSPACE/../gbarecomp"
            git clone https://github.com/mstan/gbarecomp.git "$GITHUB_WORKSPACE/../gbarecomp" || return 1
            cd "$GITHUB_WORKSPACE/../gbarecomp"
            git checkout -q "$1" && git submodule update --init --recursive || return 1
            for p in 0001 0002 0003 0005 0006; do
              patch -p1 -F3 --no-backup-if-mismatch < "$(ls /tmp/pp/$p-*.patch)" > /tmp/patch.log 2>&1 || { echo "patch $p failed on $1"; cat /tmp/patch.log; return 1; }
            done
            ( cd external/arm-recomp-core && patch -p1 -F3 --no-backup-if-mismatch < "$(ls /tmp/pp/0004-*.patch)" ) || { echo "patch 0004 failed on $1"; return 1; }
          }
          if ! ( apply_all "$GBARECOMP_REF" ); then echo "::warning::falling back to gbarecomp main"; ( apply_all origin/HEAD ) || exit 1; fi
          git -C "$GITHUB_WORKSPACE/../gbarecomp" log -1 --oneline
      - name: Recompiler + cartridge code (host)
        run: |
          cmake -S ../gbarecomp -B ../gbarecomp/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build ../gbarecomp/build --target gba_recompile
          python3 tools/scan_seeds.py
          RECOMP=$(find ../gbarecomp/build -type f -name gba_recompile | head -n1)
          $RECOMP --rom rom.gba --config recomp.toml --config recomp_scan.toml --out generated
      - name: Theos + iOS toolchain
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          mkdir -p $THEOS/toolchain/linux/iphone $THEOS/sdks
          curl -fsSL https://github.com/L1ghtmann/llvm-project/releases/download/main-update_3-eabca92/iOSToolchain-x86_64.tar.xz | tar -xJ -C $THEOS/toolchain
          curl -fsSL https://raw.githubusercontent.com/Sn0wCooder/theos-sdks/master/iPhoneOS9.3.sdk.tbz2 | tar -xj -C $THEOS/sdks
          SDK=$THEOS/sdks/iPhoneOS9.3.sdk
          for fw in $SDK/System/Library/Frameworks/*.framework; do
            if [ -f $fw/module.map ]; then mkdir -p $fw/Modules; mv $fw/module.map $fw/Modules/module.modulemap; fi
          done
          echo THEOS=$THEOS >> $GITHUB_ENV
      - name: Modern libc++ for armv7 / iOS 7 (C++20)
        working-directory: duke-ios7
        run: |
          bash ./build_libcxx.sh
          # the toolchain ships its own libc++ headers (no __config_site) and the clang driver / Theos still searches them first:
          # remove them so only libcxx-armv7/include/c++/v1 can ever be found
          rm -rf "$THEOS/toolchain/linux/iphone/include/c++/v1"
      - name: Host test (division helpers)
        run: gcc -O2 -o /tmp/rt duke-ios7/tests/rt_shim_test.c && /tmp/rt
      - name: Prepare + build
        working-directory: duke-ios7
        run: |
          FW=$GITHUB_WORKSPACE/../gbarecomp GEN=$GITHUB_WORKSPACE/generated bash ./prepare.sh
          set +e +o pipefail
          make package FINALPACKAGE=1 DUKE_OPT=1 V=1 > ../build-theos.log 2>&1; rc=$?
          set -e
          echo '--- first C++ compile command ---'; grep -m1 -E 'clang\+\+.*dispatch_table|-x c\+\+' ../build-theos.log | cut -c1-2500 || true
          tail -60 ../build-theos.log; exit $rc
      - name: Verify Mach-O
        working-directory: duke-ios7
        run: |
          export PATH=$THEOS/toolchain/linux/iphone/bin:$PATH
          BIN=$(find .theos/obj -type f -path "*DukeAdvance.app/DukeAdvance" | head -n1)
          otool -hv $BIN | tail -2
          otool -l $BIN | grep -A2 LC_VERSION_MIN_IPHONEOS | grep version
          if nm -u $BIN | grep -E "^___(u?div|u?mod)"; then exit 1; fi
          # unstripped binary + address map: lets a crash backtrace from duke.log (runtime addr - slide) be resolved
          cp $BIN DukeAdvance.unstripped
          nm -n $BIN > symbols.txt || true
      - name: Pack unsigned .ipa
        working-directory: duke-ios7
        run: |
          export PATH=$THEOS/toolchain/linux/iphone/bin:$PATH
          # .theos/obj/**/DukeAdvance.app holds only the bare binary; the staged bundle (Info.plist, resources, pseudo-signature) is in .theos/_
          APP=$(find .theos/_ -type d -name DukeAdvance.app | head -n1)
          [ -n "$APP" ] && [ -f "$APP/Info.plist" ] || { echo "staged DukeAdvance.app with Info.plist not found:"; find .theos -maxdepth 4 | head -40; exit 1; }
          ls -la "$APP"
          # fake (ad-hoc) signature: required by AppSync / TrollStore / Sideloadly-style re-signers to accept the bundle
          command -v ldid >/dev/null && ldid -S "$APP/DukeAdvance" || echo "ldid not available, skipping fake-sign"
          rm -rf Payload DukeAdvance-unsigned.ipa; mkdir -p Payload && cp -r "$APP" Payload/
          zip -qr DukeAdvance-unsigned.ipa Payload
          unzip -l DukeAdvance-unsigned.ipa | grep -E "Info.plist|DukeAdvance$"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duke-ios7
          path: |
            duke-ios7/*.ipa
            duke-ios7/packages/*.deb
            duke-ios7/DukeAdvance.unstripped
            duke-ios7/symbols.txt
            build-theos.log

